<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Holi Wishes 🌈</title>

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  text-align: center;
  overflow: hidden;
  background: linear-gradient(45deg, #ff0066, #ffcc00, #00ccff, #ff0066);
  background-size: 400% 400%;
  animation: bg 8s infinite linear;
  color: white;
}

@keyframes bg {
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

.container {
  margin-top: 80px;
  padding: 20px;
  position: relative;
  z-index: 2;
}

h1 {
  font-size: 38px;
}

input {
  padding: 12px;
  width: 250px;
  border-radius: 25px;
  border: none;
  outline: none;
  font-size: 16px;
}

button {
  padding: 12px 25px;
  margin: 10px;
  border-radius: 25px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: bold;
  transition: 0.3s;
}

.generate {
  background: white;
  color: #ff0066;
}

.share {
  background: #25D366;
  color: white;
}

button:hover {
  transform: scale(1.1);
}

.wish {
  margin-top: 30px;
  font-size: 24px;
  display: none;
  animation: pop 0.8s ease;
}

@keyframes pop {
  from{transform:scale(0);}
  to{transform:scale(1);}
}

/* Color splash circles */
.splash {
  position: absolute;
  border-radius: 50%;
  opacity: 0.6;
  animation: splash 2s linear forwards;
}

@keyframes splash {
  from {transform: scale(0); opacity: 1;}
  to {transform: scale(5); opacity: 0;}
}
</style>
</head>

<body>

<div class="container">
  <h1>🌈 Happy Holi 2026 🫟</h1>

  <input type="text" id="nameInput" placeholder="Enter Your Name">
  <br>
  <button class="generate" onclick="generateWish()">Generate Wish 🎉</button>
  <button class="share" onclick="shareWhatsApp()">Share on WhatsApp 📲</button>

  <div class="wish" id="wishMessage"></div>
</div>

<!-- Background Music -->
<audio id="holiMusic" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

<script>

function generateWish() {
  let name = document.getElementById("nameInput").value;
  let wishBox = document.getElementById("wishMessage");
  let music = document.getElementById("holiMusic");

  if(name.trim() === "") {
    alert("Please enter your name 😊");
    return;
  }

  let messages = [
    `🌸 Hey ${name}!\nMay your Holi be filled with vibrant colors,\nendless happiness and sweet memories! 🎨✨`,

    `🌈 ${name}, splash into the festival of colors!\nMay joy, love and laughter surround you\nthis beautiful Holi and always! 💖🎉`,

    `🎨 Dear ${name},\nLet’s paint life with positivity and smiles!\nWishing you a bright and cheerful Holi! 🌟`
  ];

  let randomMessage = messages[Math.floor(Math.random() * messages.length)];

  wishBox.style.display = "block";
  wishBox.innerHTML = randomMessage.replace(/\n/g, "<br>");

  music.play();

  createSplash();
}

function createSplash() {
  let splash = document.createElement("div");
  splash.classList.add("splash");
  splash.style.width = "100px";
  splash.style.height = "100px";
  splash.style.background = randomColor();
  splash.style.top = Math.random() * window.innerHeight + "px";
  splash.style.left = Math.random() * window.innerWidth + "px";
  document.body.appendChild(splash);

  setTimeout(() => splash.remove(), 2000);
}

function randomColor() {
  let colors = ["#ff0066", "#ffcc00", "#00ccff", "#00ff99", "#ff6600"];
  return colors[Math.floor(Math.random() * colors.length)];
}

function shareWhatsApp() {
  let name = document.getElementById("nameInput").value;
  if(name.trim() === "") {
    alert("Enter your name first 😊");
    return;
  }

  let text = `🌈 Happy Holi from ${name}! 🎨✨ Wishing you lots of colors, joy and happiness!`;
  let url = "https://wa.me/?text=" + encodeURIComponent(text);
  window.open(url, "_blank");
}

</script>

</body>
</html>
