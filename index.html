<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Special Holi Wish 🌈</title>

<style>
body{
  margin:0;
  font-family:Segoe UI, sans-serif;
  text-align:center;
  background:linear-gradient(-45deg,#ff0080,#ffcc00,#00ccff,#ff0080);
  background-size:400% 400%;
  animation:bg 8s ease infinite;
  color:white;
}

@keyframes bg{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

.card{
  margin:70px auto;
  padding:30px;
  width:90%;
  max-width:400px;
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(15px);
  border-radius:20px;
  box-shadow:0 8px 20px rgba(0,0,0,0.3);
}

input{
  width:90%;
  padding:12px;
  border:none;
  border-radius:25px;
  outline:none;
  margin:10px 0;
}

button{
  padding:12px 20px;
  margin:6px;
  border:none;
  border-radius:25px;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

.generate{background:white;color:#ff0080;}
.share{background:#25D366;color:white;}
.music{background:black;color:white;}

button:hover{transform:scale(1.1);}

.wish{
  margin-top:20px;
  font-size:20px;
  display:none;
  animation:pop 0.8s ease;
}

@keyframes pop{
  from{transform:scale(0);}
  to{transform:scale(1);}
}

canvas{
  position:fixed;
  top:0;
  left:0;
  pointer-events:none;
}
</style>
</head>

<body>

<div class="card">
  <h2>🌈 Happy Holi 2026 🫟</h2>

  <input type="text" id="nameBox" placeholder="Enter Your Name">
  
  <button class="generate" onclick="generateWish()">Generate Wish 🎉</button>
  <button class="share" onclick="shareWish()">Share 📲</button>
  <button class="music" onclick="toggleMusic()">🎵 Music</button>

  <div class="wish" id="wishArea"></div>
</div>

<canvas id="confetti"></canvas>
<audio id="bgMusic" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" loop></audio>

<script>

// Auto load from link
window.onload=function(){
  const params=new URLSearchParams(window.location.search);
  const name=params.get("name");
  if(name){
    document.getElementById("nameBox").value=name;
    generateWish();
  }
};

function generateWish(){
  let name=document.getElementById("nameBox").value.trim();
  let wish=document.getElementById("wishArea");

  if(name===""){
    alert("Please enter your name 😊");
    return;
  }

  let message=`
  🎨 Hey ${name}!<br>
  May your Holi be filled with vibrant colors, sweet moments & endless joy! 🌈✨<br>
  Keep shining and spreading happiness everywhere! 💖
  `;

  wish.style.display="block";
  wish.innerHTML=message;

  launchConfetti();
}

function shareWish(){
  let name=document.getElementById("nameBox").value.trim();
  if(name===""){
    alert("Enter your name first 😊");
    return;
  }

  let link=window.location.origin+window.location.pathname+"?name="+encodeURIComponent(name);
  let text=`🌈 Special Holi Wish from ${name}! 🎉\nClick here 👉 ${link}`;
  window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank");
}

function toggleMusic(){
  let music=document.getElementById("bgMusic");
  music.paused?music.play():music.pause();
}

/* Confetti */
const canvas=document.getElementById("confetti");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let pieces=[];

function launchConfetti(){
  pieces=[];
  for(let i=0;i<120;i++){
    pieces.push({
      x:Math.random()*canvas.width,
      y:Math.random()*canvas.height,
      r:Math.random()*6+3,
      color:["#ff0080","#ffcc00","#00ffcc","#ff6600"][Math.floor(Math.random()*4)]
    });
  }
  draw();
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  pieces.forEach(p=>{
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=p.color;
    ctx.fill();
    p.y+=2;
    if(p.y>canvas.height)p.y=0;
  });
  requestAnimationFrame(draw);
}

</script>

</body>
</html>
