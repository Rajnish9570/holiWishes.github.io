<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Holi Special Wish 🌈</title>

<style>
body {
  margin:0;
  font-family: 'Segoe UI', sans-serif;
  text-align:center;
  overflow-x:hidden;
  background: linear-gradient(-45deg,#ff0080,#ff8c00,#40e0d0,#ff0080);
  background-size:400% 400%;
  animation:bg 10s ease infinite;
  color:white;
}

@keyframes bg {
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

.card {
  margin:60px auto;
  padding:30px;
  width:90%;
  max-width:400px;
  backdrop-filter: blur(15px);
  background: rgba(255,255,255,0.15);
  border-radius:20px;
  box-shadow:0 8px 25px rgba(0,0,0,0.3);
}

h1 {
  font-size:28px;
}

input {
  width:90%;
  padding:12px;
  margin:8px 0;
  border:none;
  border-radius:25px;
  outline:none;
}

button {
  padding:12px 20px;
  margin:6px;
  border:none;
  border-radius:25px;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

.generate { background:white; color:#ff0080; }
.share { background:#25D366; color:white; }
.music { background:black; color:white; }

button:hover { transform:scale(1.1); }

.wish {
  margin-top:20px;
  font-size:20px;
  display:none;
  animation:pop 0.8s ease;
}

@keyframes pop {
  from{transform:scale(0);}
  to{transform:scale(1);}
}

canvas {
  position:fixed;
  top:0;
  left:0;
  pointer-events:none;
}
</style>
</head>

<body>

<div class="card">
  <h1>🌈 Happy Holi 2026 🫟</h1>

  <input type="text" id="toName" placeholder="Enter Name">
  <input type="text" id="fromName" placeholder="From (Your Name)">
  
  <button class="generate" onclick="generateWish()">Generate Wish 🎉</button>
  <button class="share" onclick="shareLink()">Share 📲</button>
  <button class="music" onclick="toggleMusic()">🎵 Music</button>

  <div class="wish" id="wishBox"></div>
</div>

<canvas id="confetti"></canvas>

<audio id="bgMusic" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" loop></audio>

<script>
// Auto detect URL params
window.onload = function() {
  const params = new URLSearchParams(window.location.search);
  const to = params.get("to");
  const from = params.get("from");

  if(to){
    document.getElementById("toName").value = to;
    if(from) document.getElementById("fromName").value = from;
    generateWish();
  }
};

function generateWish(){
  let to = document.getElementById("toName").value.trim();
  let from = document.getElementById("fromName").value.trim();
  let box = document.getElementById("wishBox");

  if(to===""){
    alert("Enter a name 😊");
    return;
  }

  let message = `
  🌸 Dear ${to},<br>
  May your life be filled with vibrant colors, happiness and positivity! 🎨✨<br>
  Wishing you a joyful and bright Holi!<br><br>
  💌 From: ${from || "Someone Special"}
  `;

  box.style.display="block";
  box.innerHTML=message;

  launchConfetti();
}

function shareLink(){
  let to = document.getElementById("toName").value.trim();
  let from = document.getElementById("fromName").value.trim();

  if(to===""){
    alert("Enter name first 😊");
    return;
  }

  let link = window.location.origin + window.location.pathname + 
             "?to=" + encodeURIComponent(to) + 
             "&from=" + encodeURIComponent(from);

  let text = `🌈 Special Holi Wish for ${to}! 🎉\nClick here 👉 ${link}`;
  window.open("https://wa.me/?text=" + encodeURIComponent(text),"_blank");
}

function toggleMusic(){
  let music=document.getElementById("bgMusic");
  music.paused?music.play():music.pause();
}

// Simple Confetti
const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let pieces = [];

function launchConfetti(){
  pieces = [];
  for(let i=0;i<150;i++){
    pieces.push({
      x:Math.random()*canvas.width,
      y:Math.random()*canvas.height,
      r:Math.random()*6+4,
      d:Math.random()*canvas.height,
      color:["#ff0080","#ffcc00","#00ffcc","#ff6600"][Math.floor(Math.random()*4)]
    });
  }
  draw();
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  pieces.forEach(p=>{
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2,false);
    ctx.fillStyle=p.color;
    ctx.fill();
    p.y+=2;
    if(p.y>canvas.height) p.y=0;
  });
  requestAnimationFrame(draw);
}
</script>

</body>
</html>
